[package]
name = "review"
version = "0.1.0"
edition = "2024"
description = "A lightweight, hardware-accelerated PDF viewer"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false, features = ["accesskit", "clipboard", "wayland", "x11"] }
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "system-fonts"] }
# Use native scheme handlers, including mailto, without URL shell interpolation.
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
pollster = "0.4"
rfd = "0.16"
roxmltree = "0.21"
unicode-segmentation = "1.12"
url = "2"
wgpu = "29"
winit = "0.30"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
tempfile = "3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSObject", "NSString", "NSURL", "NSData", "objc2-core-services"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSPrintPanel", "objc2-core-foundation"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Correct permission-bit conversion; see vendor/README.md.
mupdf = { path = "vendor/mupdf" }

[profile.release]
lto = "thin"
strip = true
