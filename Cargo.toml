[package]
name = "review"
version = "0.1.0"
edition = "2024"
description = "A lightweight, hardware-accelerated PDF viewer"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false, features = ["clipboard", "wayland", "x11"] }
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "system-fonts"] }
pollster = "0.4"
rfd = "0.16"
wgpu = "29"
winit = "0.30"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSObject", "NSString", "NSURL", "objc2-core-services"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Correct permission-bit conversion; see vendor/README.md.
mupdf = { path = "vendor/mupdf" }

[profile.release]
lto = "thin"
strip = true
