# Disposable headless compositor for tests/wayland.sh.
output HEADLESS-1 mode 1280x900 scale 1
seat seat0 fallback true
default_border pixel 0
font pango:monospace 10
# Configure native choosers as dialogs from their first frame, not tiled peers.
for_window [app_id="^zenity$"] floating enable, resize set 800 px 600 px, move position center
for_window [title="^Open PDF$"] floating enable, resize set 800 px 600 px, move position center
