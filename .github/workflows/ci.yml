name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev libfontconfig1-dev \
            libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            desktop-file-utils libglib2.0-bin
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --target "${{ matrix.target }}" -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --target "${{ matrix.target }}"
      - name: Test Linux desktop registration
        if: runner.os == 'Linux'
        run: bash tests/linux-desktop.sh
      - name: Build release executable
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Test Windows PDF registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-windows-associations.ps1
      - name: Package and smoke-test
        run: bash .github/scripts/package.sh "${{ matrix.target }}"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
