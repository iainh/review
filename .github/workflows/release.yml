name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: review-*
          merge-multiple: true
          path: dist
      - name: Verify packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test -f "dist/review-${version}-x86_64-unknown-linux-gnu.tar.gz"
          test -f "dist/review-${version}-aarch64-apple-darwin.dmg"
          test -f "dist/review-${version}-x86_64-apple-darwin.dmg"
          test -f "dist/review-${version}-x86_64-pc-windows-msvc.zip"
          (cd dist && sha256sum *.tar.gz *.dmg *.zip > SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --draft \
              --title "Review $TAG" --generate-notes
          fi
          gh release edit "$TAG" --draft=false
